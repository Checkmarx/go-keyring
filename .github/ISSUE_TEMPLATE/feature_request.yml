name: Feature request
description: Suggest a new capability or improvement for go-keyring
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please open a feature request before submitting a pull request so the
        approach can be discussed first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What is the use case?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        Describe the behaviour you would like. Include a sketch of the API if
        the change adds or modifies exported functions.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated, and why they fall short.

  - type: checkboxes
    id: platforms
    attributes:
      label: Affected platforms
      options:
        - label: Linux / BSD (Secret Service via D-Bus)
        - label: macOS (Keychain)
        - label: Windows (Credential Manager)
        - label: Mock provider / testing

  - type: textarea
    id: compatibility
    attributes:
      label: Backwards compatibility
      description: >
        Would this change break existing users of the library? If so, how?

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am willing to help implement this change.
