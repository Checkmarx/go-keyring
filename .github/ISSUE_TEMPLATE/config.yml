      Do not open a public issue for security problems. Follow the Checkmarx
      security policy instead.
  - name: Contributing guidelines
    url: https://github.com/CheckmarxDev/go-keyring/blob/master/CONTRIBUTING.md
    about: Read this before opening a pull request (DCO sign-off is required).
