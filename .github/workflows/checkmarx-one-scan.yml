name: Checkmarx One Scan

on:
  pull_request:
  push:
    branches:
      - master
      # TEMPORARY: run the scan on the release-prep test branch so the
      # changes are scanned on push, before any PR is opened.
      # Remove this entry after the branch is merged.
      - chore/GHA-301827-release-prep-scan
  schedule:
    - cron: '00 7 * * *' # Every day at 07:00

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cx-scan:
    name: Checkmarx One Scan
    runs-on: cx-private-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkmarx One CLI Action
        uses: checkmarx/ast-github-action@327efb5d1dd16ac6c7c21a9ff8ec1e8ec393b5e6 # CLI 2.3.46 update; CheckmarxDev org-standard pin
        with:
          base_uri: ${{ secrets.AST_RND_SCANS_BASE_URI }}
          cx_tenant: ${{ secrets.AST_RND_SCANS_TENANT }}
          cx_client_id: ${{ secrets.AST_RND_SCANS_CLIENT_ID }}
          cx_client_secret: ${{ secrets.AST_RND_SCANS_CLIENT_SECRET }}
          additional_params: >-
            --tags sypher
            --threshold "sca-critical=1;sca-high=1;sca-medium=1;sca-low=1;sast-critical=1;sast-high=1;sast-medium=1;sast-low=1;iac-security-critical=1;iac-security-high=1;iac-security-medium=1;iac-security-low=1"
